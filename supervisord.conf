[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; web, worker, and beat are one container so a single-user self-hosted deploy is just "docker run
; one image" — the tradeoff is you can't restart/scale one of the three independently anymore.
; Logs from all three interleave on this container's own stdout (docker logs), unprefixed.

[program:web]
command=uvicorn app.main:app --host 0.0.0.0 --port 5173
directory=/app
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker]
command=celery -A app.celery_app worker --loglevel=info
directory=/app
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:beat]
command=celery -A app.celery_app beat --loglevel=info
directory=/app
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
