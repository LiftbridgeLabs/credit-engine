# Pins the project name explicitly (otherwise Compose derives it from whatever folder this file
# lives in) — without this, renaming or moving the folder changes what name Compose looks for the
# network under, though NOT the volume, since that's pinned separately below regardless.
name: creditengine

services:
  # container_name is purely cosmetic (what shows in `docker ps`/logs) — the service key above it
  # (postgres/redis/app) is what the other containers actually use to find each other over the
  # network, and must stay as-is. Renaming the service key itself (not just container_name) would
  # break DATABASE_URL/REDIS_URL, which point at "postgres"/"redis" by that exact service name.
  postgres:
    image: postgres:16-alpine
    container_name: creditengine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: generatarr
      POSTGRES_PASSWORD: generatarr
      POSTGRES_DB: generatarr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U generatarr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: creditengine-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # web + worker + beat + the built frontend, all one image (see /Dockerfile at repo root) —
  # one container to run, one port to expose. Logs from all three internal processes interleave
  # on this container's own stdout (docker logs), unprefixed, since restarting/scaling them
  # independently isn't something a single-user self-hosted deploy needs.
  app:
    build: .
    image: liftbridgelabs/creditengine:latest
    container_name: creditengine
    restart: unless-stopped
    env_file: .env
    ports:
      - "5173:5173"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  # Pinned to the actual volume already holding your real data (created back when this project was
  # still named/pathed as "generatarr") — without this explicit name, Compose derives the volume
  # name from the project name above, and a fresh "creditengine_postgres_data" volume would be
  # silently created empty instead of reusing this one. external: true tells Compose to just use
  # whatever already exists under this name rather than trying to "own"/create it (which is what
  # produced the "created for project generatarr, expected creditengine" warning) — as a bonus,
  # Compose will never delete an external volume, so `docker compose down -v` can't touch this one.
  postgres_data:
    name: generatarr_postgres_data
    external: true
